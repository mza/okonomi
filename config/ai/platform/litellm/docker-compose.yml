version: '3.8'

services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    ports:
      - "4000:4000"
    volumes:
      - ~/.config/ai/models.yaml:/app/config.yaml:ro
    env_file:
      - .env
    command: --config /app/config.yaml --port 4000 --num_workers 4
    restart: unless-stopped
    network_mode: host  # Required to access Ollama on localhost:11434
